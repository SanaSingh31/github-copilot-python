<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sudoku Game</title>

  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

  <h1>Sudoku Game</h1>


  <!-- ========================================
       GAME CONTROLS
       ======================================== -->

  <div class="top-controls">

    <label for="difficulty">
      Difficulty:
    </label>

    <select id="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium" selected>Medium</option>
      <option value="Hard">Hard</option>
    </select>

    <button
      id="dark-mode"
      type="button"
    >
      Dark Mode
    </button>

    <span
      id="timer"
      aria-label="Game timer"
    >
      00:00
    </span>

  </div>


  <!-- ========================================
       SUDOKU BOARD
       ======================================== -->

  <div
    id="sudoku-board"
    aria-label="Sudoku puzzle board"
  ></div>


  <!-- ========================================
       GAME ACTIONS
       ======================================== -->

  <div class="controls">

    <button
      id="new-game"
      type="button"
    >
      New Game
    </button>

    <button
      id="hint"
      type="button"
    >
      Hint
    </button>

    <button
      id="check-solution"
      type="button"
    >
      Check Solution
    </button>

  </div>


  <!-- ========================================
       GAME MESSAGE
       ======================================== -->

  <div
    id="message"
    aria-live="polite"
  ></div>


  <!-- ========================================
       PLAYER NAME / SCORE FORM
       ======================================== -->

  <div
    id="name-form"
    style="display: none;"
  >

    <form id="score-form">

      <label for="player-name">
        Enter your name:
      </label>

      <input
        type="text"
        id="player-name"
        name="player-name"
        placeholder="Your name"
        maxlength="30"
        required
      >

      <button type="submit">
        Save Score
      </button>

    </form>

  </div>


  <!-- ========================================
       LEADERBOARD
       ======================================== -->

  <section
    id="leaderboard-section"
    aria-labelledby="leaderboard-title"
  >

    <h2 id="leaderboard-title">
      Top 10 Leaderboard
    </h2>

    <table id="leaderboard">

      <thead>

        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Level</th>
          <th scope="col">Hints</th>
        </tr>

      </thead>

      <tbody id="leaderboard-body"></tbody>

    </table>

  </section>


  <!-- ========================================
       JAVASCRIPT
       ======================================== -->

  <script src="/static/main.js"></script>

</body>
</html>
